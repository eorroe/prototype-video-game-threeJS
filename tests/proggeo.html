<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Geo Test</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #c { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { Noise, superEllipse, loft, computeNormals, displace, buildBufferGeometry } from '../src/player/geo.js';

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(1);
    renderer.setSize(1280, 720);
    renderer.setClearColor(0x111111, 1);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, 1280/720, 0.1, 500);
    camera.position.set(0, 3, 20);
    camera.lookAt(0, 3, 0);

    const light = new THREE.DirectionalLight(0xffffff, 20);
    light.position.set(5, 5, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 5));

    const rng = new (class { constructor(s){this.s=s;} int(a,b){return a+((this.s=(this.s*1664525+1013904223)>>>0)%(b-a+1));} float(){return(this.s=this.s*1664525+1013904223)>>>0/4294967296;} })(42);
    const noise = new Noise(rng);

    const m = { p: [], n: [], uv: [], i: [] };
    for (let i = 0; i <= 8; i++) {
      const t = i / 8;
      const y = t * 7;
      const r = 2 - t * 0.5;
      loft([{ pts: superEllipse(r, r, 2, 12), o: [0, y, 0] }], { into: m, capStart: i===0, capEnd: i===8 });
    }
    displace(m, (x,y,z,nx,ny,nz) => noise.fbm3(x*2, y*2, z*2, 3) * 0.5);
    computeNormals(m);

    const mat = new THREE.MeshStandardMaterial({
      color: 0xff0000,
      roughness: 0.5,
      metalness: 0.1,
    });

    const geo = buildBufferGeometry(m);
    geo.computeBoundingSphere();
    geo.computeBoundingBox();
    console.info('[prog-geo-test] vertices:', geo.attributes.position.count);
    console.info('[prog-geo-test] normals valid:', geo.attributes.normal.count > 0);
    console.info('[prog-geo-test] bounds:', geo.boundingSphere);

    const mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);

    window.__READY__ = true;
    renderer.render(scene, camera);
    setTimeout(() => {
      renderer.domElement.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'prog-geo-test.png';
        a.click();
        URL.revokeObjectURL(url);
        console.info('[prog-geo-test] screenshot saved');
      });
    }, 500);
  </script>
</body>
</html>
