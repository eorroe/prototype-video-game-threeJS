<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Test</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #c { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { Noise, superEllipse, loft, boxRound, ellipsoid, computeNormals, displace, warp, buildBufferGeometry } from '../src/player/geo.js';

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(1);
    renderer.setSize(1280, 720);
    renderer.setClearColor(0x111111, 1);
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, 1280/720, 0.1, 500);
    camera.position.set(0, 15, 35);
    camera.lookAt(0, 0, 0);

    const sun = new THREE.DirectionalLight(0xffffff, 8);
    sun.position.set(-30, 20, 30);
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0x8899aa, 0x222222, 3.0));
    scene.add(new THREE.AmbientLight(0x445566, 2.0));

    const rng = new (class { constructor(s){this.s=s;} int(a,b){return a+((this.s=(this.s*1664525+1013904223)>>>0)%(b-a+1));} float(){return(this.s=this.s*1664525+1013904223)>>>0/4294967296;} })(42);
    const noise = new Noise(rng);

    const SURFACES = {
      concrete: { albedo: [0.7, 0.68, 0.65], roughness: 0.92, metal: 0 },
      brick: { albedo: [0.8, 0.6, 0.45], roughness: 0.93, metal: 0 },
      plaster: { albedo: [0.85, 0.82, 0.78], roughness: 0.9, metal: 0 },
      metal_painted: { albedo: [0.6, 0.65, 0.7], roughness: 0.65, metal: 0.85 },
      asphalt: { albedo: [0.25, 0.25, 0.25], roughness: 0.96, metal: 0 },
    };

    function makeColorTex(base, size) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const i = (y * size + x) * 4;
          const n = noise.fbm3(x/size * 4, y/size * 4, 0, 4);
          const v = 0.85 + n * 0.3;
          img.data[i] = Math.floor(Math.min(1, base[0]*v)*255);
          img.data[i+1] = Math.floor(Math.min(1, base[1]*v)*255);
          img.data[i+2] = Math.floor(Math.min(1, base[2]*v)*255);
          img.data[i+3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    function makeNormalTex(size) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const strength = 0.8;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x/size, v = y/size;
          const hL = noise.fbm3(u-1/size, v, 0, 3);
          const hR = noise.fbm3(u+1/size, v, 0, 3);
          const hD = noise.fbm3(u, v-1/size, 0, 3);
          const hU = noise.fbm3(u, v+1/size, 0, 3);
          const dx = (hR-hL)*strength, dy = (hU-hD)*strength;
          const i = (y*size+x)*4;
          img.data[i] = Math.floor((dx*0.5+0.5)*255);
          img.data[i+1] = Math.floor((dy*0.5+0.5)*255);
          img.data[i+2] = 255;
          img.data[i+3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.needsUpdate = true;
      return tex;
    }

    function matFor(surface) {
      const s = SURFACES[surface];
      const albedo = makeColorTex(s.albedo, 256);
      const normal = makeNormalTex(256);
      return new THREE.MeshStandardMaterial({
        map: albedo,
        normalMap: normal,
        normalScale: new THREE.Vector2(0.8, 0.8),
        roughness: s.roughness,
        metalness: s.metal,
        envMapIntensity: 0.5,
      });
    }

    const group = new THREE.Group();
    scene.add(group);

    const groundGeo = new THREE.PlaneGeometry(200, 200, 60, 60);
    groundGeo.rotateX(-Math.PI/2);
    const pos = groundGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i);
      pos.setY(i, Math.sin(x*0.04)*Math.cos(z*0.04)*0.4 + Math.sin(x*0.08+1.3)*0.2 + Math.cos(z*0.1+0.7)*0.15);
    }
    groundGeo.computeVertexNormals();
    const ground = new THREE.Mesh(groundGeo, matFor('asphalt'));
    ground.receiveShadow = true;
    group.add(ground);

    const layouts = [
      { x: -25, z: -20, w: 12, d: 18, h: 16, surface: 'concrete' },
      { x: 20, z: -25, w: 14, d: 16, h: 18, surface: 'brick' },
      { x: -20, z: 25, w: 10, d: 12, h: 12, surface: 'plaster' },
      { x: 25, z: 20, w: 16, d: 14, h: 14, surface: 'concrete' },
      { x: 0, z: -30, w: 20, d: 10, h: 10, surface: 'metal_painted' },
      { x: -30, z: 0, w: 8, d: 22, h: 22, surface: 'concrete' },
      { x: 30, z: 0, w: 8, d: 20, h: 20, surface: 'brick' },
      { x: 0, z: 35, w: 18, d: 8, h: 10, surface: 'plaster' },
    ];

    for (const b of layouts) {
      const geo = new THREE.BoxGeometry(b.w, b.h, b.d);
      geo.translate(0, b.h/2, 0);
      const mesh = new THREE.Mesh(geo, matFor(b.surface));
      mesh.position.set(b.x, 0, b.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
    }

    console.info('[world-test] scene children:', scene.children.length, 'group children:', group.children.length);

    window.__READY__ = true;

    function render() {
      renderer.render(scene, camera);
    }
    render();

    setTimeout(() => {
      renderer.domElement.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'world-test.png';
        a.click();
        URL.revokeObjectURL(url);
        console.info('[world-test] screenshot saved');
      });
    }, 500);
  </script>
</body>
</html>
