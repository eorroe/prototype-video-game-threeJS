<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Material Test</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #c { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { Noise, superEllipse, loft, computeNormals, displace, buildBufferGeometry } from '../src/player/geo.js';

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(1);
    renderer.setSize(1280, 720);
    renderer.setClearColor(0x111111, 1);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, 1280/720, 0.1, 100);
    camera.position.set(0, 0, 5);
    camera.lookAt(0, 0, 0);

    const light = new THREE.DirectionalLight(0xffffff, 20);
    light.position.set(5, 5, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 5));

    const rng = new (class { constructor(s){this.s=s;} int(a,b){return a+((this.s=(this.s*1664525+1013904223)>>>0)%(b-a+1));} float(){return(this.s=this.s*1664525+1013904223)>>>0/4294967296;} })(42);
    const noise = new Noise(rng);

    const m = { p: [], n: [], uv: [], i: [] };
    for (let i = 0; i <= 8; i++) {
      const t = i / 8;
      const y = t * 0.7;
      const r = 0.2 - t * 0.05;
      loft([{ pts: superEllipse(r, r, 2, 12), o: [0, y, 0] }], { into: m, capStart: i===0, capEnd: i===8 });
    }
    displace(m, (x,y,z,nx,ny,nz) => noise.fbm3(x*10, y*10, z*10, 3) * 0.01);
    computeNormals(m);

    const texCanvas = document.createElement('canvas');
    texCanvas.width = texCanvas.height = 256;
    const ctx = texCanvas.getContext('2d');
    const img = ctx.createImageData(256, 256);
    for (let y = 0; y < 256; y++) {
      for (let x = 0; x < 256; x++) {
        const i = (y * 256 + x) * 4;
        const n = noise.fbm3(x/256 * 4, y/256 * 4, 0, 4);
        const v = 0.9 + n * 0.2; // brighter, less variation
        img.data[i] = Math.floor(v * 255);
        img.data[i+1] = Math.floor(v * 255);
        img.data[i+2] = Math.floor(v * 255);
        img.data[i+3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(texCanvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.needsUpdate = true;

    const mat = new THREE.MeshStandardMaterial({
      map: tex,
      roughness: 0.5,
      metalness: 0.1,
    });

    const geo = buildBufferGeometry(m);
    console.info('[mat-test] geo vertices:', geo.attributes.position.count);
    const mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);

    window.__READY__ = true;
    renderer.render(scene, camera);
    setTimeout(() => {
      renderer.domElement.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'mat-test.png';
        a.click();
        URL.revokeObjectURL(url);
        console.info('[mat-test] screenshot saved');
      });
    }, 500);
  </script>
</body>
</html>
