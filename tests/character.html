<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Test</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    #c { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { Noise, superEllipse, loft, ellipsoid, boxRound, computeNormals, displace, warp, buildBufferGeometry } from '../src/player/geo.js';

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(1);
    renderer.setSize(1280, 720);
    renderer.setClearColor(0x111111, 1);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 1280/720, 0.1, 100);
    camera.position.set(0, 1.5, 4);
    camera.lookAt(0, 1.5, 0);

    scene.add(new THREE.AmbientLight(0x667788, 8.0));
    const key = new THREE.DirectionalLight(0xffffff, 20);
    key.position.set(30, 40, 50);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x445566, 8);
    fill.position.set(-30, 20, -20);
    scene.add(fill);

    const rng = new (class { constructor(s){this.s=s;} int(a,b){return a+((this.s=(this.s*1664525+1013904223)>>>0)%(b-a+1));} float(){return(this.s=this.s*1664525+1013904223)>>>0/4294967296;} })(42);
    const noise = new Noise(rng);

    function makeColorTex(base, size) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const i = (y * size + x) * 4;
          const n = noise.fbm3(x/size * 4, y/size * 4, 0, 4);
          const v = 0.85 + n * 0.3;
          img.data[i] = Math.floor(Math.min(1, base[0]*v)*255);
          img.data[i+1] = Math.floor(Math.min(1, base[1]*v)*255);
          img.data[i+2] = Math.floor(Math.min(1, base[2]*v)*255);
          img.data[i+3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    const SURFACES = {
      black_ops: { albedo: [0.25, 0.25, 0.3], roughness: 0.6, metal: 0.1 },
    };

    const s = SURFACES.black_ops;
    const albedo = makeColorTex(s.albedo, 256);
    const mat = new THREE.MeshStandardMaterial({
      color: 0xff0000,
      roughness: 0.5,
      metalness: 0.1,
    });

    const group = new THREE.Group();
    group.position.y = 1.5;
    scene.add(group);

    const m = { p: [], n: [], uv: [], i: [] };

    const torsoRings = [];
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      const y = t * 1.2;
      const rx = 0.22 + Math.sin(t * Math.PI) * 0.12;
      const rz = 0.14 + Math.sin(t * Math.PI) * 0.08;
      torsoRings.push({ pts: superEllipse(rx, rz, 3, 16), o: [0, y, 0] });
    }
    const torso = loft(torsoRings, { capStart: true, capEnd: true });
    displace(torso, (x,y,z,nx,ny,nz) => noise.fbm3(x*12, y*12, z*12, 3) * 0.004);

    const headGeo = ellipsoid(0.18, 0.22, 0.2, { seg: 16, rows: 10 });
    warp(headGeo, (v) => {
      const t = (v.y - 1.55) / 0.22;
      if (Math.abs(t) < 0.7) v.z += 0.03 * (1 - (t/0.7)**2);
    });
    displace(headGeo, (x,y,z,nx,ny,nz) => noise.fbm3(x*20, y*20, z*20, 3) * 0.003);

    const neckRings = [];
    for (let i = 0; i <= 6; i++) {
      const t = i / 6;
      const y = t * 0.15;
      const r = 0.08 - t * 0.02;
      neckRings.push({ pts: superEllipse(r, r, 2, 12), o: [0, 1.55 + y, 0] });
    }
    const neck = loft(neckRings, { capStart: true, capEnd: true });

    const shoulderGeo = ellipsoid(0.12, 0.08, 0.1, { seg: 10, rows: 6 });
    displace(shoulderGeo, (x,y,z,nx,ny,nz) => noise.fbm3(x*15, y*15, z*15, 2) * 0.003);

    const armUpperGeo = [];
    for (let i = 0; i <= 8; i++) {
      const t = i / 8;
      const y = t * 0.7;
      const r = 0.07 - t * 0.015;
      loft([{ pts: superEllipse(r, r, 2, 10), o: [0, y, 0] }], { into: m, capStart: i===0, capEnd: i===8 });
    }

    const armLowerGeo = [];
    for (let i = 0; i <= 8; i++) {
      const t = i / 8;
      const y = t * 0.7;
      const r = 0.06 - t * 0.01;
      loft([{ pts: superEllipse(r, r, 2, 10), o: [0, y, 0] }], { into: m, capStart: i===0, capEnd: i===8 });
    }

    const handGeo = ellipsoid(0.06, 0.08, 0.04, { seg: 8, rows: 6 });

    const legUpperGeo = [];
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      const y = t * 0.9;
      const r = 0.1 - t * 0.02;
      loft([{ pts: superEllipse(r, r, 2, 12), o: [0, y, 0] }], { into: m, capStart: i===0, capEnd: i===10 });
    }

    const legLowerGeo = [];
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      const y = t * 0.9;
      const r = 0.08 - t * 0.015;
      loft([{ pts: superEllipse(r, r, 2, 12), o: [0, y, 0] }], { into: m, capStart: i===0, capEnd: i===10 });
    }

    const footGeo = boxRound(0.08, 0.06, 0.2, { n: 3, roundY: 0.3 });

    function addPart(geo, x, y, z) {
      const mesh = new THREE.Mesh(buildBufferGeometry(geo), mat);
      mesh.position.set(x, y, z);
      group.add(mesh);
    }

    addPart(torso, 0, 0.5, 0);
    addPart(headGeo, 0, 1.75, 0);
    addPart(neck, 0, 1.55, 0);
    addPart(shoulderGeo, -0.32, 1.35, 0);
    addPart(shoulderGeo, 0.32, 1.35, 0);
    addPart(armUpperGeo, -0.32, 0.75, 0);
    addPart(armUpperGeo, 0.32, 0.75, 0);
    addPart(armLowerGeo, -0.32, -0.05, 0);
    addPart(armLowerGeo, 0.32, -0.05, 0);
    addPart(handGeo, -0.32, -0.75, 0);
    addPart(handGeo, 0.32, -0.75, 0);
    addPart(legUpperGeo, -0.15, -0.5, 0);
    addPart(legUpperGeo, 0.15, -0.5, 0);
    addPart(legLowerGeo, -0.15, -1.4, 0);
    addPart(legLowerGeo, 0.15, -1.4, 0);
    addPart(footGeo, -0.15, -1.9, 0.05);
    addPart(footGeo, 0.15, -1.9, 0.05);

    console.info('[char-test] group children:', group.children.length);

    window.__READY__ = true;

    renderer.render(scene, camera);
    setTimeout(() => {
      renderer.domElement.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'char-test.png';
        a.click();
        URL.revokeObjectURL(url);
        console.info('[char-test] screenshot saved');
      });
    }, 500);
  </script>
</body>
</html>
